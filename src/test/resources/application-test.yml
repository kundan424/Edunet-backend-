spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/edtech_db
    username: edtech_user
    password: edtech_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.edtech: DEBUG

edtech:
  jwt:
    # This is a non-production test-only secret for deterministic tests
    secret: this-is-a-test-secret-key-that-is-at-least-256-bits-long
    expiration-ms: 3600000
