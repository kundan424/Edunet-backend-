server:
  shutdown: graceful
  port: ${PORT:${SERVER_PORT:8080}}
spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: edtech-platform
  lifecycle:
    timeout-per-shutdown-phase: 20s
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:edtech_db}}
    username: ${DB_USERNAME:edtech_user}
    password: ${DB_PASSWORD:edtech_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      pool-name: EdTechHikariPool
  jpa:
    hibernate:
      ddl-auto: validate
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false


management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true
info:
  app:
    name: EdTech Platform
    version: 0.0.1-SNAPSHOT
    description: EdTech Learning and Teaching Platform
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{requestId}] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.edtech: INFO

edtech:
  cors:
    allowed-origins: ${EDTECH_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-in-production-must-be-256-bits}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  video:
    completion-threshold-percent: ${VIDEO_COMPLETION_THRESHOLD:95}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  media:
    storage-type: ${MEDIA_STORAGE_TYPE:LOCAL}
  b2:
    endpoint: ${B2_ENDPOINT:}
    bucket: ${B2_BUCKET:}
    access-key: ${B2_ACCESS_KEY:}
    secret-key: ${B2_SECRET_KEY:}
    region: ${B2_REGION:auto}
  email:
    provider: ${EMAIL_PROVIDER:mock}
    resend-api-key: ${RESEND_API_KEY:}
    from: ${EMAIL_FROM:noreply@edtech.com}
